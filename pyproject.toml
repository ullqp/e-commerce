[project]
name = "e-commerce"
version = "0.1.0"
description = ""
authors = [
    {name = "Baranova.K", email = "waynaungelneal@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
pytest = "^8.3.5"
isort = "^6.0.1"
mypy = "^1.15.0"
flake8 = "^7.2.0"

# Конфигурация Black
pytest-cov = "^6.1.1"
typing-extensions = "^4.13.2"
[tool.black]
line-length = 119
exclude = '''
.git
'''

# Конфигурация isort
[tool.isort]
line_length = 119
multi_line_output = 3  # Вертикальный перенос (1 импорт на строку)
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true

# Конфигурация mypy
[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv/'